[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sravs"
version = "2.0.0"
description = "Sravs — a friendly, offline-first voice assistant with timers, memory, maths, weather and more."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sravanthi Panga" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
voice = ["SpeechRecognition>=3.10", "pyttsx3>=2.90", "PyAudio>=0.2.13"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sravs = "sravs.__main__:main"

[tool.setuptools.packages.find]
include = ["sravs*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
